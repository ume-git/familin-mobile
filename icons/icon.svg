<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">トルマモ アプリアイコン</title>
  <defs><linearGradient id="coral" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="450" y2="512">
      <stop stop-color="#ff8a5b"/><stop offset=".48" stop-color="#ff776b"/><stop offset="1" stop-color="#ff5e7e"/>
    </linearGradient><linearGradient id="porcelain" gradientUnits="userSpaceOnUse" x1="220" y1="150" x2="260" y2="360">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4fbfc"/>
    </linearGradient></defs>
  <rect width="512" height="512" fill="url(#coral)"/>
  <g transform="translate(256 256) scale(1.12) translate(-256 -256)"><g stroke-linecap="round" stroke-linejoin="round">
    <!-- Four scanning corners, with the clock naturally overlapping the fourth. -->
    <g fill="none" stroke="#fff" stroke-width="13">
